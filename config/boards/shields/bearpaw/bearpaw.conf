# Basic USB configuration
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y

# Display
CONFIG_ZMK_DISPLAY=y
CONFIG_NICE_VIEW_WIDGET_STATUS=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y

# Use the Nice!View SSD1306 driver
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_NICE_VIEW_GEM_ANIMATION_MS=960
CONFIG_ZMK_DISPLAY_REFRESH_RATE=60
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y


# LVGL settings
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_DPI_DEF=148
CONFIG_LV_Z_BITS_PER_PIXEL=1

# Disable the default widgets to prevent conflicts
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=n

CONFIG_ZMK_DISPLAY_DEDICATED_THREAD=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=2048
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=5